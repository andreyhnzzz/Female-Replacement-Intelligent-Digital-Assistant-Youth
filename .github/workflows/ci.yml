name: CI

# FRIDAY es una app de escritorio de Windows (pywin32, comtypes, QtQuick3D):
# no tiene sentido correrla en un runner Linux, asi que este workflow vive
# entero en windows-latest. Los dos scripts de prueba usan motor simulado,
# directorios temporales y feeds sinteticos (ver CLAUDE.md, seccion
# "Verificar cambios"): no tocan el vault real, no gastan llamadas de motor
# y no dependen de la red, asi que corren igual en CI que en una maquina de
# desarrollo.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        # SIEMPRE `python -m pip`, nunca `pip` a secas: el runner de
        # windows-latest trae varios Python instalados, y un `pip.exe`
        # suelto en el PATH puede resolver a uno distinto del que
        # `actions/setup-python` acaba de configurar. Con `pip install` a
        # secas, las dependencias se instalaban en el interprete
        # equivocado: los pasos de prueba corrian casi enteros sobre
        # stdlib (los imports pesados van diferidos dentro de funciones,
        # asi que el fallo no aparecia hasta el primer `import numpy` a
        # nivel de modulo) y reventaban a mitad de la suite con
        # `ModuleNotFoundError`, no al instalar. Por la misma razon, el
        # lint de abajo corre con `python -m ruff`.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Diagnostico del entorno
        # Si esto vuelve a pasar, que el log lo diga aqui y no cincuenta
        # lineas mas abajo con un ModuleNotFoundError sin contexto.
        run: |
          python -c "import sys; print('interprete:', sys.executable)"
          python -m pip show numpy PySide6 | Select-String "^Name:|^Location:"

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Pruebas — memoria, consolidacion, skills, enrutado, reloj
        run: python scripts/smoke_test.py

      - name: Pruebas — politica, puertos, red, motor, taller, PTT, avisos
        run: python scripts/system_test.py
