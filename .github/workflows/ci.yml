name: CI

# FRIDAY es una app de escritorio de Windows (pywin32, comtypes, QtQuick3D):
# no tiene sentido correrla en un runner Linux, asi que este workflow vive
# entero en windows-latest. Los dos scripts de prueba usan motor simulado,
# directorios temporales y feeds sinteticos (ver CLAUDE.md, seccion
# "Verificar cambios"): no tocan el vault real, no gastan llamadas de motor
# y no dependen de la red, asi que corren igual en CI que en una maquina de
# desarrollo.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Un `pip install` por STEP, nunca varios en el mismo bloque `run:`.
      # En pwsh (el shell por defecto de windows-latest) solo el codigo de
      # salida del ULTIMO comando de un bloque `run: |` decide si el step
      # falla — un `pip install -r requirements.txt` que revienta a mitad
      # de descarga (PySide6 pesa mucho, y un timeout de red no es raro)
      # quedaba tapado por el `pip install -r requirements-dev.txt` de la
      # linea siguiente, que si salia bien. El step entero se marcaba en
      # verde con numpy y PySide6 sin instalar, y la suite reventaba
      # cincuenta lineas mas abajo con un `ModuleNotFoundError` que no
      # tenia nada que ver con el fallo real. Steps separados: cada uno
      # se falla solo, y ademas SIEMPRE `python -m pip`, nunca `pip` a
      # secas (el runner trae varios Python instalados).
      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependencias de produccion
        run: python -m pip install --timeout 120 --retries 5 -r requirements.txt

      - name: Instalar dependencias de desarrollo
        run: python -m pip install -r requirements-dev.txt

      - name: Diagnostico del entorno
        # Si esto vuelve a pasar, que el log lo diga aqui y no cincuenta
        # lineas mas abajo con un ModuleNotFoundError sin contexto.
        run: |
          python -c "import sys; print('interprete:', sys.executable)"
          python -m pip show numpy PySide6 | Select-String "^Name:|^Location:"

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Pruebas — memoria, consolidacion, skills, enrutado, reloj
        run: python scripts/smoke_test.py

      - name: Pruebas — politica, puertos, red, motor, taller, PTT, avisos
        run: python scripts/system_test.py
