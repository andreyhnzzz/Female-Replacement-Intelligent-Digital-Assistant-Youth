# ==========================================================
#  F.R.I.D.A.Y OS  —  configuracion maestra
#  Todo es modular: cambia un valor, no toques el codigo.
# ==========================================================

[identity]
name         = "F.R.I.D.A.Y"
long_name    = "Female Replacement Intelligent Digital Assistant Youth"
user_title   = "Boss"                  # como te llama FRIDAY
language     = "es"                    # es | en
persona_file = "config/persona.md"

# ----------------------------------------------------------
# MOTOR  —  quien piensa.
# backend: claude_code | ollama | openai_compat
# Cualquier modelo local funciona: solo cambia el backend.
# ----------------------------------------------------------
[engine]
backend      = "claude_code"
timeout_s    = 180
max_turns    = 6

[engine.claude_code]
binary        = "claude"
model         = "claude-opus-5"
permission_mode = "acceptEdits"
allowed_tools = ["Read", "Write", "Edit", "Glob", "Grep", "Bash"]
# cwd del motor = la raiz de FRIDAY-OS (ve el vault como archivos)

[engine.ollama]
host  = "http://127.0.0.1:11434"
model = "llama3.1:8b"

[engine.openai_compat]
# llama.cpp server, LM Studio, vLLM, text-generation-webui...
base_url = "http://127.0.0.1:8080/v1"
model    = "local-model"
api_key  = "not-needed"

# ----------------------------------------------------------
# MEMORIA  —  solo markdown. Sin base de datos. Nunca.
# ----------------------------------------------------------
[vault]
root         = "vault"
raw          = "raw"        # captura cruda: transcripciones, notas sueltas
wiki         = "wiki"       # notas atomicas enlazadas -> el grafo
outputs      = "outputs"    # lo que FRIDAY produce: planes, resumenes
daily_format = "%Y-%m-%d"
index_ttl_s  = 3            # re-escanea el vault si paso mas de esto

# ----------------------------------------------------------
# VOZ  —  100% local. El audio NUNCA sale de este equipo.
# ----------------------------------------------------------
[voice]
enabled = true

[voice.ptt]
key            = "space"    # manten la barra y habla
mode           = "hold"     # hold | toggle
require_focus  = false      # false = hotkey global
min_duration_s = 0.35       # ignora toques accidentales
max_duration_s = 60.0

[voice.stt]
engine       = "faster_whisper"   # faster_whisper | whisper_cpp | vosk
model        = "small"            # tiny | base | small | medium | large-v3
device       = "auto"             # auto | cpu | cuda
compute_type = "int8"
language     = "es"
sample_rate  = 16000
vad_filter   = true

[voice.tts]
engine    = "piper"        # piper | sapi5 | none
voice     = "es_MX-claude-high"
model_dir = "models/piper"
speed     = 1.05
volume    = 0.9
# fallback automatico a SAPI5 (Windows, tambien local) si piper no esta

# ----------------------------------------------------------
# HUD  —  La Cara. Una sola pantalla, sin pestanas.
# ----------------------------------------------------------
[hud]
enabled     = true
host        = "127.0.0.1"
port        = 8787
autolaunch  = true
kiosk       = true          # abre en ventana de app, sin barra del navegador
theme       = "amber"       # amber | cyan | ice
refresh_ms  = 1000

# ----------------------------------------------------------
# SKILLS  —  las 5 manos de FRIDAY
# ----------------------------------------------------------
[skills]
enabled = ["metricas", "inbox", "plan", "vault", "agenda"]

[skills.metricas]
sources        = ["vault/wiki", "vault/raw"]
frontmatter_key = "metric"
include_system = true       # CPU/RAM/disco como vitales

[skills.inbox]
lookback_h  = 24
max_items   = 12
write_to    = "outputs"

[skills.plan]
top_n     = 3
write_to  = "outputs"
mirror_to_daily = true

[skills.vault]
allow_write = true
max_read_kb = 256

[skills.agenda]
file       = "wiki/Agenda.md"
horizon_days = 7

# ----------------------------------------------------------
# PRIVACIDAD  —  candados duros
# ----------------------------------------------------------
[privacy]
local_only_audio  = true    # aborta si un STT/TTS intenta salir a la red
log_transcripts   = true    # se guardan en vault/raw (tu disco)
redact_in_logs    = []      # palabras a censurar en logs
