# ==========================================================
#  F.R.I.D.A.Y  —  configuracion maestra
#  Acompañante de escritorio. Todo es modular: cambia un
#  valor, no toques el codigo.
# ==========================================================

[identity]
name         = "F.R.I.D.A.Y"
long_name    = "Female Replacement Intelligent Digital Assistant Youth"
user_title   = "Jefe"                  # como te llama FRIDAY
language     = "es"
persona_file = "config/persona.md"

# ----------------------------------------------------------
# MOTOR  —  quien piensa.
#
# `backend` es solo el arranque. A partir de ahi el roster manda:
# «cambia a Sonnet» conmuta en caliente sin reiniciar nada.
#
# adaptadores: claude_code | anthropic_api | ollama | openai_compat
# ----------------------------------------------------------
[engine]
backend       = "claude_code"
default_model = "opus"        # una `key` del roster de abajo
timeout_s     = 180
max_turns     = 6

# ── el roster ────────────────────────────────────────────
# Cada entrada es un modelo alcanzable y COMO PEDIRLO HABLANDO.
# `say` son los alias que el STT puede producir: incluye las
# variantes mal transcritas, salen gratis y evitan un «no te
# entendi» cada vez que el reconocedor escribe «soneto».
#
# Gana el alias mas largo que aparezca en la frase.

[[engine.roster]]
key     = "opus"
label   = "Opus 5"
backend = "claude_code"
model   = "claude-opus-5"
say     = ["opus", "opus cinco", "el grande", "el profundo"]
note    = "razonamiento profundo; el mas lento de los tres"

[[engine.roster]]
key     = "sonnet"
label   = "Sonnet 5"
backend = "claude_code"
model   = "claude-sonnet-5"
say     = ["sonnet", "soneto", "sonet", "el equilibrado"]
note    = "equilibrio entre calidad y latencia; el de diario"

[[engine.roster]]
key     = "haiku"
label   = "Haiku 4.5"
backend = "claude_code"
model   = "claude-haiku-4-5-20251001"
say     = ["haiku", "aiku", "jaiku", "el rapido"]
note    = "respuesta inmediata para ordenes cortas"

# El mismo Claude, pero por HTTP directo: sin levantar Node ni
# cruzar el shim .CMD de npm. Es el camino corto y se nota en
# cada turno hablado. Necesita ANTHROPIC_API_KEY y factura por
# token, mientras que `claude_code` viaja en tu suscripcion.
[[engine.roster]]
key     = "directo"
label   = "Opus 5 directo"
backend = "anthropic_api"
model   = "claude-opus-5"
say     = ["directo", "api", "modo rapido", "por api"]
note    = "el mismo Opus sin el arranque de Claude Code"

[[engine.roster]]
key     = "local"
label   = "Llama 3.1 8B"
backend = "ollama"
model   = "llama3.1:8b"
say     = ["local", "llama", "sin nube", "offline", "el local"]
note    = "corre en tu maquina; nada sale del equipo"

[engine.claude_code]
binary          = "claude"
model           = "claude-opus-5"
permission_mode = "acceptEdits"
# solo se usan en modo agentico; el razonamiento corre sin herramientas
allowed_tools   = ["Read", "Write", "Edit", "Glob", "Grep"]

[engine.anthropic_api]
base_url    = "https://api.anthropic.com"
model       = "claude-opus-5"
max_tokens  = 2048
api_key_env = "ANTHROPIC_API_KEY"     # se lee del entorno, no del disco

[engine.ollama]
host  = "http://127.0.0.1:11434"
model = "llama3.1:8b"

# Habla el dialecto /chat/completions. Sirve para lo local
# (llama.cpp, LM Studio, vLLM) y para lo remoto: OpenAI, Groq,
# OpenRouter, DeepSeek y la capa compatible de Gemini. Cambiar
# de proveedor es base_url + api_key_env, sin codigo nuevo.
[engine.openai_compat]
base_url    = "http://127.0.0.1:8080/v1"
model       = "local-model"
api_key     = "not-needed"
api_key_env = ""                      # p.ej. "OPENAI_API_KEY" si vas a la nube

# ----------------------------------------------------------
# ACOMPANANTE  —  la ventana flotante.
# ----------------------------------------------------------
[desktop]
width         = 760
height        = 460
corner        = "bottom-right"   # bottom-right | bottom-left | top-right | top-left
margin        = 24
level_ms      = 60               # refresco del nivel de audio del nucleo
always_on_top = true
# Desenfoque real de Windows 11 tras la ventana: none | acrylic | mica | tabbed
# «none» deja el nucleo flotando sobre el escritorio (recomendado).
backdrop      = "none"

# ── el nucleo holografico ────────────────────────────────
# quick3d    escena 3D real: camara en perspectiva, nube de nodos
#            con profundidad, bloom y desenfoque de campo.
# projected  plan B en 2.5D sobre Canvas. Sin dependencia de
#            QtQuick3D ni del driver. Si el nucleo no aparece o
#            la ventana parpadea, cambia a esto.
[desktop.core]
mode        = "quick3d"
nodes       = 1400          # puntos de la nube; 600 en equipos justos
spokes      = 28            # radios que salen del nucleo
dust        = 260           # polvo orbital
bloom       = true
depth_field = true          # el desenfoque cinematografico del fondo
fov         = 42

# ----------------------------------------------------------
# SISTEMA  —  las manos sobre la computadora.
# ----------------------------------------------------------
[system]
# TTL del catalogo de aplicaciones. Es generoso porque el catalogo ya no
# es solo el Menu Inicio: tambien levanta un PowerShell para ver las apps
# de la Store y lee los manifiestos de Steam. Instalar algo nuevo tarda
# como mucho esto en aparecer.
app_cache_s      = 600
index_store_apps = true      # apps empaquetadas (Store/UWP) via Get-StartApps
index_steam      = true      # juegos instalados, via steamapps/*.acf
defaults_cache_s = 300       # TTL de la lectura de apps predeterminadas
max_scan         = 40000     # tope de archivos por busqueda
search_engine    = "default" # default | google | bing | youtube | github | wikipedia
allow_ocr        = false     # requiere tesseract instalado
screen_max_chars = 4000
page_max_chars   = 12000     # cuanto texto de una pagina llega al motor
fetch_timeout_s  = 12
# Contacto que viaja en el User-Agent cuando FRIDAY sale a la red.
# NO es opcional en la practica: Wikimedia devuelve 403 a todo si no hay una
# forma de contacto entre parentesis (y bloquea los agentes que fingen ser
# Chrome). Pon tu correo o la URL de tu repo.
contact          = "https://github.com/topics/friday-desktop-companion"

# Alias hablados -> como se llama la cosa en el catalogo. Cada valor puede
# ser un nombre o una lista de candidatos: se prueban todos y gana el que
# mejor puntue. Sirve igual para apps que para juegos.
#
# El codigo ya trae los obvios (`vscode`, `chrome`, `cs`...). Los TUYOS van
# en `config/friday.local.toml`, que no se versiona — si no, cada alias que
# añadas cuenta al mundo que tienes instalado.
[system.app_aliases]
navegador = ["brave", "google chrome", "microsoft edge", "firefox"]

# ----------------------------------------------------------
# NOTICIAS  —  fuentes RSS. FRIDAY no raspa portadas: lee
# exactamente los feeds que declares aqui.
# ----------------------------------------------------------
[news]
timeout_s  = 10
per_source = 8

[[news.sources]]
name  = "Xataka"
topic = "tecnologia"
url   = "https://www.xataka.com/feedburner.xml"

[[news.sources]]
name  = "Genbeta"
topic = "tecnologia"
url   = "https://www.genbeta.com/feedburner.xml"

[[news.sources]]
name  = "BBC Mundo"
topic = "mundo"
url   = "https://feeds.bbci.co.uk/mundo/rss.xml"

[[news.sources]]
name  = "El Pais Portada"
topic = "general"
url   = "https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/portada"

[[news.sources]]
name  = "El Pais Ciencia"
topic = "ciencia"
url   = "https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/section/ciencia/portada"

# ----------------------------------------------------------
# POLITICA  —  el guardia. Nada con efecto pasa sin permiso.
# El STT se equivoca; esto evita que un error de
# reconocimiento se convierta en un desastre.
# ----------------------------------------------------------
[policy]
enabled            = true
allow_launch       = true     # abrir aplicaciones
allow_file_write   = true     # mover, renombrar, organizar
allow_shell        = false    # ejecutar comandos crudos: apagado por defecto
allow_web          = true     # abrir busquedas en TU navegador
allow_web_fetch    = true     # que FRIDAY salga a la red por su cuenta

# Control directo del escritorio. Separados porque el riesgo no se
# parece: el volumen se deshace solo, el bloqueo te deja fuera, y el
# portapapeles suele tener lo ultimo que copiaste — a veces una clave.
allow_media        = true     # volumen y reproduccion
allow_clipboard    = true     # leer y escribir el portapapeles
allow_session      = false    # bloquear/suspender: apagado por defecto
allow_agent        = true     # delegarle trabajo a un agente dentro de un repo
confirm_over_files = 5        # sobre este numero, pide confirmacion hablada

# Donde PUEDE escribir. Fuera de aqui, no.
write_roots = ["~/Documents", "~/Downloads", "~/Desktop", "~/Pictures"]
# Donde puede leer y buscar.
read_roots  = ["~"]

# Donde puede soltar un AGENTE (la skill `taller`). Lista aparte de
# `write_roots` a proposito: que FRIDAY pueda guardar un briefing en
# Documentos no significa que pueda ponerse a refactorizar ahi.
#
# Esta es la unica fuente de proyectos: lo que no este debajo de una de
# estas rutas no existe para el taller, aunque lo nombres.
#
# **Vacia de fabrica, y asi debe quedarse aqui.** Este archivo es publico:
# poner tus rutas es publicar la estructura de tu disco y el nombre de tus
# proyectos. Las tuyas van en `config/friday.local.toml`, que no se
# versiona, y se fusionan encima de esto:
#
#     [policy]
#     agent_roots = ["~/proyectos", "~/trabajo/api-clientes"]
#
# NO pongas "~": tu perfil entero incluye AppData, y ademas dejaria al
# agente ver cualquier cosa que tengas en el escritorio.
agent_roots = []
# Nunca se lanzan, aunque esten instalados.
blocked_apps = ["regedit*", "diskpart*", "cmd.exe", "powershell*"]
# Nunca se descargan. La red local ya esta bloqueada de fabrica.
blocked_hosts = []

# ----------------------------------------------------------
# MEMORIA  —  solo markdown. Sin base de datos. Nunca.
# ----------------------------------------------------------
[vault]
root         = "vault"
raw          = "raw"
wiki         = "wiki"
outputs      = "outputs"
daily_format = "%Y-%m-%d"
index_ttl_s  = 3

# ----------------------------------------------------------
# VOZ  —  100% local. El audio NUNCA sale de este equipo.
# ----------------------------------------------------------
[voice]
enabled = true

[voice.ptt]
key            = "f9"
mode           = "toggle"      # toggle: pulsa para abrir, pulsa para cerrar
require_focus  = false
min_duration_s = 0.35
max_duration_s = 60.0

[voice.stt]
engine       = "faster_whisper"
model        = "small"
device       = "auto"
compute_type = "int8"
language     = "es"
sample_rate  = 16000
vad_filter   = true

[voice.tts]
engine    = "piper"
voice     = "es_MX-claude-high"
model_dir = "models/piper"
speed     = 1.05
volume    = 0.9

# ----------------------------------------------------------
# SKILLS
# ----------------------------------------------------------
[skills]
enabled = ["metricas", "inbox", "plan", "vault", "agenda",
           "sistema", "archivos", "pantalla", "ordenador", "taller",
           "noticias", "web", "motor"]

[skills.metricas]
sources         = ["vault/wiki", "vault/raw"]
frontmatter_key = "metric"
include_system  = true

[skills.inbox]
lookback_h = 24
max_items  = 12
write_to   = "outputs"

[skills.plan]
top_n           = 3
write_to        = "outputs"
mirror_to_daily = true

[skills.vault]
allow_write = true
max_read_kb = 256

[skills.agenda]
file         = "wiki/Agenda.md"
horizon_days = 7

[skills.sistema]
prefer_focus = true          # si ya esta abierto, enfocar en vez de relanzar

[skills.archivos]
max_results    = 15
rename_pattern = "{date} — {name}"

[skills.pantalla]
log_reads = true             # cada lectura de pantalla queda anotada

[skills.ordenador]
# La accion concreta la elige el motor contra el catalogo declarado en
# skills/ordenador.py; aqui no hay nada que guionizar.

# Encargarle trabajo a un agente dentro de un proyecto, hablando.
# DONDE puede trabajar no se decide aqui sino en `[policy] agent_roots`:
# los permisos viven con el guardia, no con la skill.
[skills.taller]
timeout_s   = 900            # un encargo puede tardar; el turno no espera
max_turns   = 24             # tope de iteraciones del agente
depth       = 2              # niveles de subcarpeta que se miran por raiz
read_tools  = ["Read", "Glob", "Grep"]
write_tools = ["Read", "Glob", "Grep", "Write", "Edit"]

[skills.noticias]
max_items = 12
archive   = true             # deja el briefing en outputs/
write_to  = "outputs"

[skills.web]
max_chars = 12000

# ----------------------------------------------------------
# CONVERSACION  —  el hilo de los ultimos turnos.
#
# Vive en RAM y se pierde al cerrar: NO es memoria. La memoria de
# FRIDAY es markdown y solo markdown, y lo que merece recordarse se
# dice («recuerda que...») y acaba en el vault.
#
# Sirve para que «y eso cuanto cuesta» tenga a que referirse.
# ----------------------------------------------------------
[chat]
max_turns        = 12        # turnos que se recuerdan (usuario + FRIDAY)
max_chars        = 4000      # tope duro del hilo; recorta por lo mas viejo
ttl_s            = 900       # sin hablar este rato, el hilo se corta solo
speak_max_chars  = 700       # cuanto se dice en voz alta; el panel lleva todo

# ----------------------------------------------------------
# PRIVACIDAD  —  candados duros
# ----------------------------------------------------------
[privacy]
local_only_audio = true      # bloquea la red durante STT/TTS
log_transcripts  = true      # se guardan en vault/raw (tu disco)
redact_in_logs   = []
